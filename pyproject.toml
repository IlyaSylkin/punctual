[project]
name = "punctual"
version = "0.1.0"
description = "Независимая оценка точности прогнозов прибытия городского транспорта"
readme = "README.md"
authors = [
    { name = "Ilya Sylkin", email = "ilyasylkin@outlook.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
punctual = "punctual:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
# разведочные скрипты замера: опубликованы как есть, под линтер не переписываются
extend-exclude = ["tools/probe"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# кириллица в строках, комментариях и докстрингах
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
